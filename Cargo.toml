
[package]
name = "skill-sync"
version = "0.1.0"
edition = "2024"
description = "Skill sync tool for managing personal skills repository"
license = "APACHE-2.0"
readme = "README.md"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
uninlined_format_args = "warn"

[dependencies]
blake3 = "1"
dirs = "6"
git2 = { version = "0.21", features = ["https", "ssh"] }
tempfile = "3"
thiserror = "1"

[lib]
name = "skill_sync"
path = "src/lib.rs"
